name: Portfolio quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/test-admin-overview.cjs scripts/test-cms-reliability.cjs scripts/test-public-controls.cjs scripts/test-template-integration.cjs scripts/test-visual.cjs scripts/test-works.cjs
      - run: npm run build
